name: Publish GHCR image

on:
  push:
    branches:
      - 'main'

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/new-api

jobs:
  resolve_tag:
    name: Resolve tag
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Resolve tag
        id: version
        run: |
          TAG="$(date +%Y%m%d%H)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${TAG}"

  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    needs: resolve_tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    env:
      TAG: ${{ needs.resolve_tag.outputs.tag }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.ref }}

      - name: Prepare the hacked files
        id: prepare
        run: |
          cp -r ./hacked/web ./

      - name: Write VERSION
        run: |
          echo "${TAG}" > VERSION
          echo "Building tag: ${TAG} for ${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ env.REGISTRY_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Image summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Docker Image Digest (${{ matrix.arch }})"
            echo '```'
            echo "${REGISTRY_IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  merge:
    name: Merge manifest
    needs:
      - resolve_tag
      - build_single_arch
    runs-on: ubuntu-latest

    permissions:
      packages: write

    env:
      TAG: ${{ needs.resolve_tag.outputs.tag }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          count="$(find . -maxdepth 1 -type f | wc -l)"
          if [ "${count}" -ne 2 ]; then
            echo "::error::Expected 2 digests, found ${count}"
            exit 1
          fi
          docker buildx imagetools create \
            -t "${REGISTRY_IMAGE}:${TAG}" \
            -t "${REGISTRY_IMAGE}:latest" \
            $(printf "${REGISTRY_IMAGE}@sha256:%s " *)

      - name: Image summary
        run: |
          {
            echo "### Docker Image Manifest"
            echo '```'
            docker buildx imagetools inspect "${REGISTRY_IMAGE}:${TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
